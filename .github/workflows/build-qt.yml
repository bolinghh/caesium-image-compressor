name: Build and test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            host: windows
            arch: win64_mingw
          - os: ubuntu-latest
            host: linux
            arch: linux_gcc_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: ${{ matrix.host }}
          target: desktop
          arch: ${{ matrix.arch }}
          modules: qtimageformats
          tools: ${{ matrix.host == 'windows' && 'tools_mingw1310' || '' }}
          cache: true
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DENABLE_HEIF=OFF
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_HEIF=OFF
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: dtolnay/rust-toolchain@stable
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtimageformats
          cache: true
      - name: Build pinned codecs
        run: python3 scripts/build-macos-deps.py
      - name: Prepare Sparkle 1.27.1
        run: |
          curl --fail --location --retry 3 --retry-all-errors https://github.com/sparkle-project/Sparkle/releases/download/1.27.1/Sparkle-1.27.1.tar.xz -o build/Sparkle.tar.xz
          echo '20d729f8ca4d07911da31fe0296880cd3176b71738deaf2b7f8de2d96cf63f4e  build/Sparkle.tar.xz' | shasum -a 256 -c -
          mkdir -p build/sparkle
          tar -xf build/Sparkle.tar.xz -C build/sparkle
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_PREFIX_PATH="$Qt6_DIR;$PWD/build/dependencies/install" -DSPARKLE_FRAMEWORK="$PWD/build/sparkle/Sparkle.framework" -DSPARKLE_INCLUDE_DIR="$PWD/build/sparkle/Sparkle.framework/Headers"
      - run: cmake --build build --config Release --parallel 3
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify self-contained local bundle
        run: python3 scripts/package-macos.py 'build/Caesium Image Compressor.app' --qt "$Qt6_DIR" --library-path build/dependencies/install/lib --library-path build/libcaesium-prefix/src/libcaesium/target/release
